<html lang="pl">
<head>

<title>Quiz – Starożytna Grecja</title>
<style>
:root{--blue:#1f4e79;--blue2:#2e6aa3;--sky:#e8f0f8;--gold:#c99a2e;--ok:#2e8b57;--okbg:#e6f4ec;--bad:#c0392b;--badbg:#fbeaea;--ink:#1d2733;--mute:#5b6875}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"DejaVu Sans",sans-serif;color:var(--ink);background:#f4f1ea;min-height:100vh}
.meander{height:14px;background:repeating-linear-gradient(90deg,var(--blue) 0 14px,transparent 14px 21px)}
header{background:var(--blue);color:#fff;text-align:center;padding:16px 10px 12px}
header h1{margin:0;font-family:Georgia,"DejaVu Serif",serif;letter-spacing:1.5px;font-size:26px}
header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:780px;margin:22px auto 40px;padding:0 14px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:22px 24px;margin-bottom:16px}
h2{margin:0 0 12px;color:var(--blue);font-size:20px}
label.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
label.opt:hover{background:var(--sky)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:7px 16px;font-size:15px;cursor:pointer;font-weight:600}
.pill.on{background:var(--blue);color:#fff}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--blue2)}
.btn.sec{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.small{font-size:13px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:6px}
.bar{height:10px;background:#dde4ec;border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.tag{display:inline-block;background:var(--sky);color:var(--blue);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;margin-bottom:8px}
.qtext{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:16px}
.choices{display:grid;gap:9px}
.choice{text-align:left;border:2px solid #cfd8e3;background:#fff;border-radius:10px;padding:12px 14px;font-size:16px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--blue);background:var(--sky)}
.choice.sel{border-color:var(--blue);background:var(--sky)}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.tf{display:flex;gap:12px}.tf .choice{flex:1;text-align:center;font-weight:700}
input[type=text],textarea{width:100%;font-size:17px;padding:11px 13px;border:2px solid #cfd8e3;border-radius:10px;font-family:inherit}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
input.ok{border-color:var(--ok);background:var(--okbg)} input.bad{border-color:var(--bad);background:var(--badbg)}
select{font-size:15px;padding:7px 8px;border:2px solid #cfd8e3;border-radius:8px;background:#fff;font-family:inherit;max-width:100%}
select.ok{border-color:var(--ok);background:var(--okbg)} select.bad{border-color:var(--bad);background:var(--badbg)}
.mrow{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed #e1e6ec}
.mrow b{font-weight:600}
.gap{line-height:2.6;font-size:17px}
.gap select{margin:0 3px}
.order{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.order li{display:flex;align-items:center;gap:10px;border:2px solid #cfd8e3;border-radius:10px;padding:9px 12px;background:#fff}
.order li .num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.order li .txt{flex:1}
.order li button{border:0;background:var(--sky);color:var(--blue);border-radius:6px;width:34px;height:30px;font-size:16px;cursor:pointer}
.order li button:disabled{opacity:.3;cursor:default}
.order li.ok{border-color:var(--ok);background:var(--okbg)} .order li.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:16px;border-radius:10px;padding:12px 14px;font-size:15.5px;line-height:1.45}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.fb.mid{background:#fff6e0;border-left:5px solid var(--gold)}
.fb.info{background:var(--sky);border-left:5px solid var(--blue)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.big{font-size:54px;font-weight:800;color:var(--blue);text-align:center;margin:4px 0}
.grade{text-align:center;font-size:22px;font-weight:700;margin-bottom:6px}
.rev{border-top:1px solid #e3e8ee;padding:10px 0;font-size:14.5px}
.rev .q{font-weight:600}
.rev .y{color:var(--bad)} .rev .c{color:var(--ok)}
.hist{font-size:14px;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.topicbox{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
@media(max-width:600px){.topicbox{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}.qtext{font-size:17px}}
</style>

<div class="meander"></div>
<header><h1>🏛 STAROŻYTNA GRECJA</h1><p>Quiz z historii · klasa 5 · Rozdział II</p></header>
<div class="meander"></div>
<main id="app"></main>

<script>
// ===== BAZA PYTAŃ =====
// Typy: C wybór, TF prawda/fałsz, S wpisz słowo, N liczba, W wiek, M łączenie, O kolejność, G luki, P otwarte (samoocena)
const Q = [];
let _id = 0;
const add = o => { o.id = ++_id; Q.push(o); };
const C  = (t,q,opts,e="") => add({t,type:"C",q,opts,e});
const TF = (t,q,a,e="") => add({t,type:"TF",q,a,e});
const S  = (t,q,acc,e="") => add({t,type:"S",q,acc,e});
const N  = (t,q,a,e="") => add({t,type:"N",q,a,e});
const W  = (t,q,a,bc,e="") => add({t,type:"W",q,a,bc,e});
const M  = (t,q,pairs,e="") => add({t,type:"M",q,pairs,e});
const O  = (t,q,items,e="") => add({t,type:"O",q,items,e});
const G  = (t,text,extra,e="") => add({t,type:"G",q:"Uzupełnij tekst – wybierz właściwe wyrazy.",text,extra,e});
const P  = (t,q,model) => add({t,type:"P",q,model});

const TOPICS = {
  1:"Demokratyczne Ateny",
  2:"Sparta i wojny z Persami",
  3:"Bogowie i mity",
  4:"Kultura starożytnej Grecji",
  5:"Imperium Aleksandra Wielkiego",
  6:"Oś czasu i obliczenia"
};

// ---------- TEMAT 1: DEMOKRATYCZNE ATENY ----------
C(1,"Jak starożytni Grecy nazywali swój kraj?",["Hellada","Lakonia","Persja","Macedonia"],"Grecy nazywali siebie Hellenami, a swój kraj – Helladą.");
C(1,"Jak nazywali siebie starożytni Grecy?",["Hellenami","Persami","Fenicjanami","Rzymianami"]);
C(1,"Jakie morze otacza Grecję z trzech stron?",["Morze Śródziemne","Morze Czarne","Morze Bałtyckie","Morze Kaspijskie"]);
C(1,"Jakim krajem jest Grecja?",["górzystym, z małą ilością urodzajnej ziemi","nizinnym, z wielkimi rzekami","pustynnym, bez dostępu do morza","bagnistym i lesistym"]);
C(1,"Co uprawiali starożytni Grecy?",["zboże, oliwki i winorośl","ryż, herbatę i bawełnę","ziemniaki, kukurydzę i pomidory","kawę, kakao i trzcinę cukrową"]);
C(1,"Jakie zwierzęta hodowali Grecy na górskich pastwiskach?",["kozy i owce","wielbłądy i lamy","bawoły i słonie","renifery i jaki"]);
C(1,"Kiedy na terenie Grecji osiedliły się pierwsze greckie plemiona?",["w II tysiącleciu p.n.e.","w I wieku n.e.","w V wieku n.e.","w X wieku n.e."]);
C(1,"Kiedy ostatecznie ukształtowały się greckie miasta-państwa (polis)?",["w VIII wieku p.n.e.","w V wieku p.n.e.","w I wieku n.e.","w II tysiącleciu n.e."]);
C(1,"Co stanowiło naturalne granice między greckimi polis?",["góry","rzeki","mury obronne","pustynie"]);
C(1,"Co utrudniało wrogom zdobycie Grecji?",["wysokie łańcuchy górskie i otaczające ją morza","wielkie rzeki i bagna","rozległe pustynie","gęste lasy"]);
C(1,"Która polis w V wieku p.n.e. była najbogatsza w całej Helladzie?",["Ateny","Sparta","Troja","Milet"],"Ateny miały liczną flotę wojenną i handlową.");
C(1,"Dzięki czemu Ateny stały się jednym z najpotężniejszych greckich miast-państw?",["dzięki licznej flocie wojennej i handlowej","dzięki słoniom bojowym","dzięki złotu z Egiptu","dzięki pracy helotów"]);
C(1,"Co oznacza słowo „demokracja”?",["władzę ludu","władzę króla","władzę bogów","władzę wojska"],"Od greckich słów demos (lud) i kratos (władza).");
C(1,"Greckie słowo „demos” oznacza:",["lud","władzę","miasto","wojnę"]);
C(1,"Greckie słowo „kratos” oznacza:",["władzę","lud","mądrość","morze"]);
C(1,"Gdzie w Atenach podejmowano najważniejsze decyzje dotyczące państwa?",["na zgromadzeniu ludowym","w pałacu króla","w świątyni Zeusa","na igrzyskach w Olimpii"]);
C(1,"Jak zapadała decyzja na zgromadzeniu ludowym w Atenach?",["większością głosów","decyzją króla","przez losowanie","decyzją kapłanów"],"Przyjęcie wniosku musiała poprzeć przeważająca liczba zgromadzonych.");
C(1,"Kto wprowadzał w życie postanowienia zgromadzenia ludowego?",["urzędnicy wybierani co roku","król i jego rodzina","kapłani z Delf","Spartanie"]);
C(1,"Kto był najwybitniejszym Ateńczykiem V wieku p.n.e., uważanym za twórcę demokracji ateńskiej?",["Perykles","Leonidas","Homer","Kserkses"]);
C(1,"Kto miał prawo brać udział w zgromadzeniu ludowym w Atenach?",["pełnoletni mężczyźni, których rodzice byli Ateńczykami","wszyscy mieszkańcy Aten","tylko najbogatsi mieszkańcy","kobiety i mężczyźni powyżej 18 lat"]);
C(1,"Kto w starożytnych Atenach NIE miał praw obywatelskich?",["kobiety, niewolnicy i przybysze z innych miast","pełnoletni mężczyźni z rodziców Ateńczyków","bogaci kupcy urodzeni w Atenach","urzędnicy"]);
C(1,"Czym był akropol w greckim mieście?",["wzgórzem, które było twierdzą i miejscem kultu","placem targowym","portem dla statków","teatrem pod gołym niebem"]);
C(1,"Czym była agora?",["centralnym placem miasta (placem targowym)","wzgórzem ze świątyniami","szkołą dla chłopców","więzieniem"]);
C(1,"Do czego najczęściej służyły amfory?",["do przechowywania wina i oliwy z oliwek","do gotowania zupy","jako hełmy dla żołnierzy","do pisania listów"]);
C(1,"Jak nazywa się największa grecka wyspa?",["Kreta","Rodos","Itaka","Salamina"]);
C(1,"Która współczesna polska instytucja pełni funkcję zbliżoną do ateńskiego zgromadzenia ludowego?",["Sejm","sąd","szkoła","policja"]);
C(1,"Z czego, poza polityką, zasłynął Perykles?",["dowodził armią, był mówcą i wspierał naukę i sztukę","wyrzeźbił posąg Zeusa","był królem Sparty","napisał „Iliadę”"]);
C(1,"Dlaczego amfory są dziś cennym źródłem historycznym?",["przedstawiano na nich ważne wydarzenia, sceny z życia i mity","są zrobione ze złota","zapisano na nich prawa Aten","służyły jako mapy"]);
TF(1,"Grecja to kraj z wieloma wielkimi rzekami.",false,"Grecja nie ma wielkich rzek.");
TF(1,"Greckie terytoria obejmują ponad tysiąc wysp.",true);
TF(1,"Starożytni Grecy stworzyli jedno wspólne państwo.",false,"Tworzyli wiele samodzielnych polis.");
TF(1,"Każda polis miała własne władze i wojsko.",true);
TF(1,"Mieszkańców Grecji łączyła wspólna kultura, jeden język i wiara w tych samych bogów.",true);
TF(1,"Kobiety w starożytnych Atenach mogły głosować na zgromadzeniu ludowym.",false);
TF(1,"Niewolnicy w Atenach nie mieli praw obywatelskich.",true);
TF(1,"Przybysz z innego greckiego miasta, mieszkający w Atenach wiele lat, miał prawa obywatelskie.",false);
TF(1,"Urzędników w Atenach wybierano co roku.",true);
TF(1,"W Atenach każdy obywatel, bez względu na majątek i pochodzenie, mógł zabrać głos w sprawach państwa.",true);
TF(1,"W starożytnych Atenach w imieniu obywateli decydowali wybrani posłowie i senatorowie.",false,"Ateńczycy głosowali osobiście – posłowie i senatorowie są we współczesnej demokracji.");
TF(1,"We współczesnych państwach demokratycznych kobietom przysługują prawa obywatelskie.",true);
TF(1,"Sparta była najbogatszą polis Grecji w V wieku p.n.e.",false,"Najbogatsze były Ateny.");
TF(1,"Na zgromadzeniu ludowym dyskutowano np. o wypowiedzeniu wojny, zawarciu pokoju i nowych podatkach.",true);
TF(1,"Polis najczęściej obejmowała miasto oraz okoliczne wsie.",true);
S(1,"Jak nazywa się greckie miasto-państwo?",["polis"]);
S(1,"Jak nazywał się centralny plac (plac targowy) greckiego miasta?",["agora"]);
S(1,"Jak nazywało się wzgórze w greckim mieście, będące twierdzą i miejscem kultu?",["akropol","akropolis"]);
S(1,"Jak nazywa się ustrój, w którym władzę sprawują wszyscy wolni obywatele?",["demokracja"]);
S(1,"Jak nazywał się najwybitniejszy Ateńczyk V wieku p.n.e.?",["Perykles"]);
S(1,"Jak nazywa się naczynie, w którym Grecy przechowywali wino i oliwę?",["amfora","amfory"]);
S(1,"Jak nazywa się największa grecka wyspa?",["Kreta"]);
S(1,"Na jakim zgromadzeniu Ateńczycy podejmowali najważniejsze decyzje?",["zgromadzenie ludowe","ludowym","zgromadzeniu ludowym"]);
S(1,"Która polis była najbogatsza w Helladzie w V wieku p.n.e.?",["Ateny"]);
M(1,"Połącz pojęcie z jego znaczeniem.",[["polis","miasto-państwo"],["agora","plac targowy"],["akropol","wzgórze – twierdza i miejsce kultu"],["demokracja","władza ludu"],["amfora","naczynie na wino i oliwę"]]);
M(1,"Połącz greckie słowo z jego znaczeniem.",[["demos","lud"],["kratos","władza"],["Hellada","Grecja"],["Hellenowie","Grecy"]]);
G(1,"W V wieku p.n.e. najbogatszą polis w Helladzie stały się [Ateny]. Panowała tam [demokracja]. Najważniejsze decyzje podejmowano na [zgromadzeniu ludowym]. Najwybitniejszym Ateńczykiem tamtych czasów był [Perykles].",["Sparta","Leonidas","w świątyni"]);
G(1,"Grecy nazywali siebie [Hellenami], a swój kraj – [Helladą]. Tworzyli wiele samodzielnych miast-państw zwanych [polis]. Naturalne granice między nimi stanowiły [góry].",["Persami","Lakonią","rzeki"]);
G(1,"Grecja to [górzysty] kraj, z trzech stron otoczony Morzem [Śródziemnym]. Grecy uprawiali zboże, [oliwki] i winorośl, a na pastwiskach hodowali kozy i [owce].",["nizinny","Czarnym","ryż","wielbłądy"]);
P(1,"Podaj dwie różnice między demokracją ateńską a współczesną.","W Atenach obywatele głosowali osobiście, a dziś wybieramy przedstawicieli (posłów i senatorów). W Atenach kobiety, niewolnicy i przybysze nie mieli praw – dziś prawa mają wszyscy obywatele, nie ma niewolnictwa.");
P(1,"Wyjaśnij, dlaczego starożytni Grecy nie stworzyli jednego państwa.","Góry i morza chroniły Grecję przed wrogami, więc plemiona nie musiały się łączyć. Góry oddzielały doliny – w nich powstawały osobne polis.");
P(1,"Opisz warunki przyrodnicze starożytnej Grecji.","Kraj górzysty, z trzech stron otoczony Morzem Śródziemnym, ponad tysiąc wysp, mało urodzajnej ziemi, brak wielkich rzek; uprawy tylko na małych równinach i w górskich dolinach.");
P(1,"Na czym polegały demokratyczne rządy w starożytnych Atenach?","Najważniejsze decyzje podejmowali obywatele na zgromadzeniu ludowym, głosując – decydowała większość głosów. Urzędnicy wybierani co roku wprowadzali decyzje w życie.");
P(1,"Wyjaśnij, czym była grecka polis.","Samodzielne miasto-państwo: miasto z okolicznymi wsiami, z własnymi władzami i wojskiem.");

// ---------- TEMAT 2: SPARTA I WOJNY Z PERSAMI ----------
C(2,"W jakiej krainie leżała Sparta?",["w Lakonii","w Macedonii","w Persji","w Egipcie"]);
C(2,"Jak nazywano podbitą ludność, którą Spartanie zamienili w niewolników?",["heloci","periojkowie","hoplici","Hellenowie"]);
C(2,"Kim byli periojkowie?",["ludźmi wolnymi bez praw politycznych, zajmującymi się rzemiosłem i handlem","niewolnikami pracującymi na roli","pełnoprawnymi obywatelami Sparty","perskimi żołnierzami"]);
C(2,"Jaką część plonów heloci musieli oddawać Spartanom?",["połowę","jedną dziesiątą","wszystko","nic"]);
C(2,"Do którego roku życia Spartanie pełnili służbę wojskową?",["do 60. roku życia","do 20. roku życia","do 30. roku życia","do 40. roku życia"]);
C(2,"Ilu królów jednocześnie sprawowało władzę w Sparcie?",["dwóch","jeden","trzech","dziesięciu"],"Jeden wyruszał na wojnę, drugi zostawał w polis.");
C(2,"Dlaczego w Sparcie było dwóch królów?",["bo jeden wyruszał jako dowódca na wojnę, a drugi zostawał w polis","bo każdy rządził inną wyspą","bo tak nakazał perski król","bo jeden był kapłanem"]);
C(2,"Co przypominało państwo spartańskie?",["obóz wojskowy","wielki targ","świątynię","teatr"]);
C(2,"Kim byli hoplici?",["ciężkozbrojnymi greckimi piechurami","perskimi łucznikami","niewolnikami w Sparcie","aktorami w teatrze"]);
C(2,"Jak nazywano okrągłą tarczę hoplity?",["hoplon","falanga","amfora","agora"]);
C(2,"Jak nazywał się zwarty szyk greckich wojowników?",["falanga","hoplon","polis","akropol"]);
C(2,"Co powszechnie mówiono o spartańskich wojownikach?",["że jeden Spartanin walczy lepiej niż trzech innych Greków","że boją się wody","że walczą tylko konno","że nigdy nie ćwiczą"]);
C(2,"Dlaczego kobiety w Sparcie musiały dbać o sprawność fizyczną?",["by rodzić zdrowe i silne dzieci – przyszłych wojowników","bo walczyły w falandze","bo startowały w igrzyskach","bo były kapłankami"]);
C(2,"Po co Spartanie utrzymywali stałą gotowość bojową?",["by zapobiec buntom podbitej ludności","by zdobyć Egipt","by wygrywać igrzyska","by chronić Ateny"]);
C(2,"Gdzie leżało imperium perskie?",["na wschód od Grecji, w Azji i Afryce","na północ od Grecji, w Europie","na zachód od Grecji, w Italii","na wyspie Krecie"]);
C(2,"Co to jest danina?",["obowiązkowa opłata na rzecz władcy","rodzaj tarczy","umowa między państwami","bitwa morska"]);
C(2,"Które greckie miasto przewodziło powstaniu przeciw Persom w 499 r. p.n.e.?",["Milet","Sparta","Ateny","Troja"]);

<script>
// ===== POMOCNICZE =====
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l")
  .replace(/[„”"'.,!?;:()\-–—]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function textOk(ans, accs) {
  const a = norm(ans); if (!a) return false;
  for (const acc of accs) {
    const n = norm(acc);
    if (a === n) return true;
    const tol = n.length >= 8 ? 2 : n.length >= 5 ? 1 : 0;
    if (lev(a, n) <= tol) return true;
    if (n.length >= 5 && a.includes(n)) return true;
    if (a.split(" ").some(w => w.length >= 4 && lev(w, n) <= tol)) return true;
  }
  return false;
}
const ROM = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
const toRoman = n => { let s = ""; for (const [v, r] of ROM) while (n >= v) { s += r; n -= v; } return s; };
function fromRoman(s) { const v = {i:1,v:5,x:10,l:50,c:100,d:500,m:1000}; let t = 0; for (let i = 0; i < s.length; i++) { const a = v[s[i]], b = v[s[i + 1]] || 0; if (!a) return NaN; t += a < b ? -a : a; } return t; }
function parseCentury(ans) {
  let s = norm(ans).replace(/przed nasza era|naszej ery|p n e|pne|n e|wieku|wiek|\bw\b/g, " ").replace(/\s+/g, " ").trim();
  const tok = s.split(" ")[0] || "";
  if (/^\d+$/.test(tok)) return parseInt(tok, 10);
  if (/^[ivxlcdm]+$/.test(tok)) return fromRoman(tok);
  return NaN;
}
const parseNum = ans => { const m = String(ans).replace(/\s/g, "").match(/\d+/); return m ? parseInt(m[0], 10) : NaN; };
const pts = q => q.type === "M" ? q.pairs.length : q.type === "G" ? (q.text.match(/\[/g) || []).length : q.type === "O" ? 2 : 1;
const GRADES = [[96,"celujący","🏆"],[86,"bardzo dobry","🌟"],[71,"dobry","👍"],[51,"dostateczny","🙂"],[31,"dopuszczający","📚"],[0,"niedostateczny","💪"]];
const gradeFor = p => GRADES.find(g => p >= g[0]);
const store = {
  get() { try { return JSON.parse(localStorage.getItem("grecja_quiz_hist") || "[]"); } catch (e) { return []; } },
  add(r) { try { const h = this.get(); h.unshift(r); localStorage.setItem("grecja_quiz_hist", JSON.stringify(h.slice(0, 8))); } catch (e) {} }
};

// ===== STAN =====
let cfg = { topics: [1,2,3,4,5,6], count: 20, order: "topic", types: "all" };
let ST = null;

// ===== EKRAN STARTOWY =====
function startScreen() {
  const counts = {}; Q.forEach(q => counts[q.t] = (counts[q.t] || 0) + 1);
  const hist = store.get();
  $("#app").innerHTML = `
  <div class="card">
    <h2>Witaj! Sprawdź, co wiesz o starożytnej Grecji</h2>
    <p class="small">W bazie jest <b>${Q.length}</b> pytań różnego rodzaju: wybór odpowiedzi, prawda/fałsz, wpisywanie, łączenie w pary, układanie w kolejności, uzupełnianie tekstu, obliczenia na osi czasu i pytania otwarte. Za każdym razem losują się inne.</p>
  </div>
  <div class="card">
    <h2>1. Wybierz tematy</h2>
    <div class="topicbox">
      ${Object.entries(TOPICS).map(([k, v]) => `<label class="opt"><input type="checkbox" class="tp" value="${k}" ${cfg.topics.includes(+k) ? "checked" : ""}> <span><b>${k == 6 ? "★" : k + "."}</b> ${v} <span class="small">(${counts[k] || 0})</span></span></label>`).join("")}
    </div>
    <div class="row" style="margin-top:8px"><button class="pill" id="allT">zaznacz wszystkie</button><button class="pill" id="noneT">odznacz</button></div>
  </div>
  <div class="card">
    <h2>2. Ile pytań?</h2>
    <div class="row" id="cnt">${[10,20,30,50].map(n => `<button class="pill ${cfg.count === n ? "on" : ""}" data-n="${n}">${n}</button>`).join("")}<button class="pill ${cfg.count === 0 ? "on" : ""}" data-n="0">wszystkie</button></div>
    <h2 style="margin-top:18px">3. Rodzaj pytań</h2>
    <div class="row" id="typ">
      <button class="pill ${cfg.types === "all" ? "on" : ""}" data-t="all">wszystkie rodzaje</button>
      <button class="pill ${cfg.types === "closed" ? "on" : ""}" data-t="closed">tylko zamknięte</button>
      <button class="pill ${cfg.types === "open" ? "on" : ""}" data-t="open">tylko do wpisania</button>
    </div>
    <h2 style="margin-top:18px">4. Kolejność</h2>
    <div class="row" id="ord">
      <button class="pill ${cfg.order === "topic" ? "on" : ""}" data-o="topic">po kolei, wg tematów</button>
      <button class="pill ${cfg.order === "random" ? "on" : ""}" data-o="random">wymieszane</button>
    </div>
  </div>
  <div class="actions" style="justify-content:center"><button class="btn gold" id="go" style="font-size:19px;padding:14px 40px">Zaczynamy! ▶</button></div>
  ${hist.length ? `<div class="card hist"><h2 style="font-size:16px">Ostatnie wyniki</h2>${hist.map(h => `<div>${h.d} – ${h.p}% (${h.g}), ${h.n} pytań</div>`).join("")}</div>` : ""}`;
  $("#allT").onclick = () => document.querySelectorAll(".tp").forEach(c => c.checked = true);
  $("#noneT").onclick = () => document.querySelectorAll(".tp").forEach(c => c.checked = false);
  document.querySelectorAll("#cnt .pill").forEach(b => b.onclick = () => { cfg.count = +b.dataset.n; startScreen(); });
  document.querySelectorAll("#typ .pill").forEach(b => b.onclick = () => { saveTopics(); cfg.types = b.dataset.t; startScreen(); });
  document.querySelectorAll("#ord .pill").forEach(b => b.onclick = () => { saveTopics(); cfg.order = b.dataset.o; startScreen(); });
  $("#go").onclick = () => { saveTopics(); if (!cfg.topics.length) { alertBox("Zaznacz przynajmniej jeden temat."); return; } begin(); };
}
function saveTopics() { cfg.topics = [...document.querySelectorAll(".tp")].filter(c => c.checked).map(c => +c.value); }
function alertBox(msg) { const d = document.createElement("div"); d.className = "fb bad"; d.textContent = msg; $("#app").prepend(d); setTimeout(() => d.remove(), 2500); }

const CLOSED = ["C","TF","M","O","G"], OPEN = ["S","N","W","P"];
function pick() {
  let pool = Q.filter(q => cfg.topics.includes(q.t));
  if (cfg.types === "closed") pool = pool.filter(q => CLOSED.includes(q.type));
  if (cfg.types === "open") pool = pool.filter(q => OPEN.includes(q.type));
  const n = cfg.count === 0 ? pool.length : Math.min(cfg.count, pool.length);
  // losowanie równomierne z tematów, z mieszaniem typów
  const byT = {}; shuffle(pool).forEach(q => (byT[q.t] = byT[q.t] || []).push(q));
  for (const t in byT) { // przeplot typów w obrębie tematu
    const byType = {}; byT[t].forEach(q => (byType[q.type] = byType[q.type] || []).push(q));
    const lists = shuffle(Object.values(byType)), out = [];
    while (lists.some(l => l.length)) lists.forEach(l => l.length && out.push(l.shift()));
    byT[t] = out;
  }
  const keys = shuffle(Object.keys(byT)), chosen = [];
  while (chosen.length < n) { let added = false; for (const k of keys) { if (chosen.length >= n) break; if (byT[k].length) { chosen.push(byT[k].shift()); added = true; } } if (!added) break; }
  return cfg.order === "topic" ? chosen.sort((a, b) => a.t - b.t) : shuffle(chosen);
}
function begin(list) {
  const qs = list || pick();
  ST = { qs, i: 0, got: 0, max: 0, log: [] };
  showQ();
}

// ===== PYTANIE =====
let cur = null; // stan bieżącego pytania
function showQ() {
  const q = ST.qs[ST.i]; cur = { q, done: false };
  const pct = Math.round(ST.i / ST.qs.length * 100);
  let body = "";
  if (q.type === "C") {
    cur.opts = shuffle(q.opts);
    body = `<div class="choices">${cur.opts.map((o, i) => `<button class="choice" data-i="${i}">${String.fromCharCode(65 + i)}. ${esc(o)}</button>`).join("")}</div>`;
  } else if (q.type === "TF") {
    body = `<div class="tf"><button class="choice" data-v="1">✔ PRAWDA</button><button class="choice" data-v="0">✘ FAŁSZ</button></div>`;
  } else if (q.type === "S" || q.type === "N" || q.type === "W") {
    const ph = q.type === "N" ? "wpisz liczbę" : q.type === "W" ? "np. V w. p.n.e." : "wpisz odpowiedź";
    body = `<input type="text" id="inp" placeholder="${ph}" autocomplete="off">${q.type === "W" ? `<div class="hint">Możesz wpisać cyframi rzymskimi (V) albo arabskimi (5).</div>` : ""}`;
  } else if (q.type === "M") {
    cur.right = shuffle(q.pairs.map(p => p[1]));
    body = q.pairs.map((p, i) => `<div class="mrow"><b>${esc(p[0])}</b><select data-i="${i}"><option value="">— wybierz —</option>${cur.right.map(r => `<option>${esc(r)}</option>`).join("")}</select></div>`).join("");
  } else if (q.type === "O") {
    cur.arr = shuffle(q.items); if (cur.arr.every((x, i) => x === q.items[i])) cur.arr.reverse();
    body = `<ul class="order" id="ol"></ul><div class="hint">Przesuwaj strzałkami ▲▼ – na górze najwcześniejsze.</div>`;
  } else if (q.type === "G") {
    const ans = [...q.text.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
    cur.gaps = ans; const bank = shuffle([...new Set([...ans, ...(q.extra || [])])]);
    let k = 0;
    body = `<div class="gap">${esc(q.text).replace(/\[([^\]]+)\]/g, () => `<select data-i="${k++}"><option value="">……</option>${bank.map(b => `<option>${esc(b)}</option>`).join("")}</select>`)}</div>`;
  } else if (q.type === "P") {
    body = `<textarea id="inp" rows="4" placeholder="Napisz swoją odpowiedź…"></textarea><div class="hint">To pytanie otwarte – po napisaniu zobaczysz wzorcową odpowiedź i sam(a) ocenisz swoją.</div>`;
  }
  $("#app").innerHTML = `
  <div class="top"><span>Pytanie ${ST.i + 1} z ${ST.qs.length}</span><span>Punkty: <b>${fmt(ST.got)}</b> / ${ST.max}</span></div>
  <div class="bar"><div style="width:${pct}%"></div></div>
  <div class="card">
    <span class="tag">${q.t == 6 ? "★" : q.t + "."} ${TOPICS[q.t]} · ${typeName(q.type)}</span>
    <div class="qtext">${esc(q.type === "TF" ? "Prawda czy fałsz? " + q.q : q.q)}</div>
    ${body}
    <div id="fb"></div>
    <div class="actions"><button class="btn sec" id="quit">Zakończ</button><button class="btn" id="chk">Sprawdź</button></div>
  </div>`;
  $("#quit").onclick = () => { if (ST.log.length) results(); else startScreen(); };
  $("#chk").onclick = check;
  if (q.type === "C" || q.type === "TF") {
    document.querySelectorAll(".choice").forEach(b => b.onclick = () => { if (cur.done) return; document.querySelectorAll(".choice").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); cur.sel = b; });
  }
  if (q.type === "O") drawOrder();
  const inp = $("#inp"); if (inp) { inp.focus(); if (q.type !== "P") inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#chk").click(); } }); }
}
const typeName = t => ({C:"wybierz odpowiedź",TF:"prawda / fałsz",S:"wpisz odpowiedź",N:"oblicz",W:"określ wiek",M:"połącz w pary",O:"ułóż w kolejności",G:"uzupełnij tekst",P:"pytanie otwarte"}[t]);
const fmt = x => Number.isInteger(x) ? x : x.toFixed(1).replace(".", ",");
function drawOrder() {
  $("#ol").innerHTML = cur.arr.map((x, i) => `<li><span class="num">${i + 1}</span><span class="txt">${esc(x)}</span><button data-u="${i}" ${i === 0 ? "disabled" : ""}>▲</button><button data-d="${i}" ${i === cur.arr.length - 1 ? "disabled" : ""}>▼</button></li>`).join("");
  $("#ol").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (cur.done) return;
    const i = +(b.dataset.u ?? b.dataset.d), j = b.dataset.u !== undefined ? i - 1 : i + 1;
    [cur.arr[i], cur.arr[j]] = [cur.arr[j], cur.arr[i]]; drawOrder();
  });
}

function check() {
  const q = cur.q;
  if (cur.done) return next();
  let score = 0, max = pts(q), your = "", correct = "", fbExtra = "";
  if (q.type === "C") {
    if (!cur.sel) return hint("Zaznacz odpowiedź.");
    const pick = cur.opts[+cur.sel.dataset.i]; your = pick; correct = q.opts[0];
    score = pick === q.opts[0] ? 1 : 0;
    document.querySelectorAll(".choice").forEach(b => { b.disabled = true; const o = cur.opts[+b.dataset.i]; if (o === q.opts[0]) b.classList.add("ok"); else if (b === cur.sel) b.classList.add("bad"); });
  } else if (q.type === "TF") {
    if (!cur.sel) return hint("Wybierz: prawda czy fałsz.");
    const v = cur.sel.dataset.v === "1"; your = v ? "prawda" : "fałsz"; correct = q.a ? "prawda" : "fałsz";
    score = v === q.a ? 1 : 0;
    document.querySelectorAll(".choice").forEach(b => { b.disabled = true; if ((b.dataset.v === "1") === q.a) b.classList.add("ok"); else if (b === cur.sel) b.classList.add("bad"); });
  } else if (q.type === "S" || q.type === "N" || q.type === "W") {
    const inp = $("#inp"), v = inp.value.trim(); if (!v) return hint("Wpisz odpowiedź.");
    your = v;
    if (q.type === "S") { score = textOk(v, q.acc) ? 1 : 0; correct = q.acc[0]; }
    if (q.type === "N") { score = parseNum(v) === q.a ? 1 : 0; correct = String(q.a); }
    if (q.type === "W") { score = parseCentury(v) === q.a ? 1 : 0; correct = toRoman(q.a) + " w." + (q.bc ? " p.n.e." : " n.e."); }
    inp.classList.add(score ? "ok" : "bad"); inp.disabled = true;
  } else if (q.type === "M") {
    const sels = [...document.querySelectorAll(".mrow select")];
    if (sels.some(s => !s.value)) return hint("Dopasuj wszystkie elementy.");
    sels.forEach(s => { const p = q.pairs[+s.dataset.i]; const ok = s.value === p[1]; if (ok) score++; s.classList.add(ok ? "ok" : "bad"); s.disabled = true; });
    your = sels.map(s => q.pairs[+s.dataset.i][0] + " → " + s.value).join("; ");
    correct = q.pairs.map(p => p[0] + " → " + p[1]).join("; ");
    if (score < max) fbExtra = "<br><b>Poprawnie:</b><br>" + q.pairs.map(p => `${esc(p[0])} → ${esc(p[1])}`).join("<br>");
  } else if (q.type === "O") {
    const good = cur.arr.filter((x, i) => x === q.items[i]).length;
    score = good === q.items.length ? 2 : good >= Math.ceil(q.items.length / 2) ? 1 : 0;
    $("#ol").querySelectorAll("li").forEach((li, i) => { li.classList.add(cur.arr[i] === q.items[i] ? "ok" : "bad"); li.querySelectorAll("button").forEach(b => b.disabled = true); });
    your = cur.arr.join(" → "); correct = q.items.join(" → ");
    if (score < 2) fbExtra = "<br><b>Poprawna kolejność:</b><br>" + q.items.map((x, i) => `${i + 1}. ${esc(x)}`).join("<br>");
  } else if (q.type === "G") {
    const sels = [...document.querySelectorAll(".gap select")];
    if (sels.some(s => !s.value)) return hint("Uzupełnij wszystkie luki.");
    sels.forEach(s => { const ok = s.value === cur.gaps[+s.dataset.i]; if (ok) score++; s.classList.add(ok ? "ok" : "bad"); s.disabled = true; });
    your = sels.map(s => s.value).join(", "); correct = cur.gaps.join(", ");
    if (score < max) fbExtra = "<br><b>Poprawnie:</b> " + cur.gaps.map(esc).join(", ");
  } else if (q.type === "P") {
    const inp = $("#inp"), v = inp.value.trim(); if (!v) return hint("Napisz choć krótką odpowiedź.");
    inp.disabled = true; cur.done = "self";
    $("#fb").innerHTML = `<div class="fb info"><b>Przykładowa dobra odpowiedź:</b><br>${esc(q.model)}<br><br>Porównaj ze swoją. Jak oceniasz swoją odpowiedź?</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-s="1" style="background:var(--ok)">Dobrze (1 pkt)</button><button class="btn gold" data-s="0.5">Częściowo (½ pkt)</button><button class="btn" data-s="0" style="background:var(--bad)">Źle (0 pkt)</button></div>`;
    $("#chk").style.display = "none";
    document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      const s = +b.dataset.s; record(q, s, 1, v, q.model);
      document.querySelectorAll("[data-s]").forEach(x => x.disabled = true);
      $("#chk").style.display = ""; $("#chk").textContent = ST.i + 1 < ST.qs.length ? "Dalej ▶" : "Zobacz wynik 🏁"; cur.done = true; $("#chk").focus();
    });
    return;
  }
  record(q, score, max, your, correct);
  const cls = score === max ? "ok" : score > 0 ? "mid" : "bad";
  const head = score === max ? pickPraise() : score > 0 ? `Częściowo dobrze (${fmt(score)} / ${max} pkt).` : "Niestety nie.";
  let body = "";
  if (score < max && ["C","TF","S","N","W"].includes(q.type)) body += ` Poprawna odpowiedź: <b>${esc(correct)}</b>.`;
  body += fbExtra;
  if (q.e) body += `<br><span class="small">💡 ${esc(q.e)}</span>`;
  $("#fb").innerHTML = `<div class="fb ${cls}"><b>${head}</b>${body}</div>`;
  cur.done = true;
  $("#chk").textContent = ST.i + 1 < ST.qs.length ? "Dalej ▶" : "Zobacz wynik 🏁";
  $("#chk").focus();
}
const PRAISE = ["Brawo!","Świetnie!","Dokładnie tak!","Super!","Doskonale!","Tak jest!","Bezbłędnie!"];
const pickPraise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];
function hint(m) { $("#fb").innerHTML = `<div class="fb mid">${m}</div>`; }
function record(q, score, max, your, correct) { ST.got += score; ST.max += max; ST.log.push({q, score, max, your, correct}); }
function next() { ST.i++; if (ST.i >= ST.qs.length) results(); else showQ(); }
document.addEventListener("keydown", e => { if (e.key === "Enter" && cur && cur.done === true && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); next(); } });

// ===== WYNIKI =====
function results() {
  cur = null;
  const p = ST.max ? Math.round(ST.got / ST.max * 100) : 0; const g = gradeFor(p);
  const wrong = ST.log.filter(l => l.score < l.max);
  const d = new Date(); store.add({d: d.toLocaleDateString("pl-PL") + " " + d.toLocaleTimeString("pl-PL", {hour: "2-digit", minute: "2-digit"}), p, g: g[1], n: ST.log.length});
  const perT = {}; ST.log.forEach(l => { const t = l.q.t; perT[t] = perT[t] || [0, 0]; perT[t][0] += l.score; perT[t][1] += l.max; });
  $("#app").innerHTML = `
  <div class="card" style="text-align:center">
    <h2>Koniec quizu!</h2>
    <div style="font-size:46px">${g[2]}</div>
    <div class="big">${p}%</div>
    <div class="grade">Ocena: ${g[1]}</div>
    <div class="small">${fmt(ST.got)} / ${ST.max} pkt · ${ST.log.length} pytań</div>
  </div>
  <div class="card"><h2 style="font-size:17px">Wynik w tematach</h2>
    ${Object.keys(perT).sort().map(t => { const [a, b] = perT[t], pp = Math.round(a / b * 100); return `<div style="margin:6px 0"><div class="small">${t == 6 ? "★" : t + "."} ${TOPICS[t]} – ${pp}%</div><div class="bar" style="margin:3px 0 0"><div style="width:${pp}%"></div></div></div>`; }).join("")}
  </div>
  <div class="actions" style="justify-content:center">
    ${wrong.length ? `<button class="btn gold" id="again">Powtórz błędne (${wrong.length})</button>` : ""}
    <button class="btn" id="newq">Nowy quiz</button>
  </div>
  ${wrong.length ? `<div class="card"><h2 style="font-size:17px">Do poprawki</h2>${wrong.map(l => `<div class="rev"><div class="q">${esc(l.q.type === "G" ? l.q.text.replace(/\[[^\]]+\]/g, "……") : l.q.q)}</div><div class="y">Twoja odpowiedź: ${esc(l.your)}</div><div class="c">Poprawnie: ${esc(l.correct)}</div></div>`).join("")}</div>` : `<div class="card" style="text-align:center">Wszystko bezbłędnie – gratulacje! 🎉</div>`}`;
  if (wrong.length) $("#again").onclick = () => begin(shuffle(wrong.map(l => l.q)));
  $("#newq").onclick = startScreen;
  window.scrollTo(0, 0);
}

startScreen();
</script>
</body>
</html>
